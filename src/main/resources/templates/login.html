<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <style>
        body{
            font-family: Arial;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            background:#f4f4f4;
        }

        .card{
            background:white;
            padding:40px;
            border-radius:10px;
            width:300px;
            box-shadow:0 10px 20px rgba(0,0,0,0.1);
        }

        input{
            width:100%;
            margin-bottom:15px;
            padding:10px;
        }

        button{
            width:100%;
            padding:10px;
            border:none;
            background:#6c63ff;
            color:white;
            cursor:pointer;
        }
    </style>
</head>
<body>

<div class="card">

    <h2>Login</h2>

    <form method="post" th:action="@{/login}">

        <input type="text"
               name="username"
               placeholder="Usuário"
               required>

        <input type="password"
               name="password"
               placeholder="Senha"
               required>

        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}" />


        <button type="submit">
            Entrar
        </button>

    </form>

</div>

</body>
</html>
