<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanatech Chamados</title>
    <link rel="stylesheet" href="../templates/formulario.css">

</head>
<body>

<aside class="sidebar">
    <div class="sidebar-logo">
        <div class="logo-icon">K</div>
        <div class="logo-text">
            <div class="brand">Kanatech</div>
            <div class="sub">Chamados</div>
        </div>
    </div>
    <nav class="sidebar-nav">
        <a class="nav-item active" href="/">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
                <rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
            </svg>
            Abrir um chamado
        </a>
    </nav>
    <div class="sidebar-user">
        <div class="user-avatar">UA</div>
        <div class="user-info">
            <div class="name">Usuário</div>
            <div class="email">user@test.com</div>
        </div>
    </div>
</aside>

<main class="main">
    <h1>Abrir um chamado</h1>
    <hr class="divider">

    <div th:if="${sucesso}" class="alert-success">
        Chamado aberto com sucesso.
    </div>

    <form th:action="@{/chamado/novo}" th:object="${chamado}" method="post">
        <div class="form-group">
            <label for="nomeSolicitante">Nome do solicitante</label>
            <input type="text" id="nomeSolicitante" th:field="*{nomeSolicitante}"
                   placeholder="Como prefere ser chamado" required />
        </div>

        <div class="form-group">
            <label for="setor">Setor</label>
            <input type="text" id="setor" th:field="*{setor}"
                   placeholder="Ex: Financeiro, RH, Vendas..." required />
        </div>

        <div class="form-group">
            <label for="servico">Serviço</label>
            <input type="text" id="servico" th:field="*{servico}"
                   placeholder="Infraestrutura, solicitação de compra..." required />
        </div>

        <div class="form-group">
            <label for="descricao">Descreva o problema</label>
            <textarea id="descricao" th:field="*{descricao}"
                      placeholder="Descrição" required></textarea>
        </div>

        <button type="submit" class="btn-submit">Continuar</button>
    </form>
</main>

</body>
</html>
