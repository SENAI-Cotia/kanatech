<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../templates/chamados.css">
    <title>Kanatech – Gestão de Chamados</title>

</head>
<body>

<aside class="sidebar">
    <div class="sidebar-logo">
        <div class="logo-icon">K</div>
        <div class="logo-text">
            <div class="brand">Kanatech</div>
            <div class="sub">Chamados</div>
        </div>
    </div>
    <div class="sidebar-role">Admin</div>
    <nav class="sidebar-nav">
        <a class="nav-item active" href="/ti/chamados">
            <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/>
                <rect x="9" y="3" width="6" height="4" rx="1"/>
            </svg>
            Chamados
        </a>
        <a class="nav-item" href="#">
            <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 010 14.14M4.93 19.07a10 10 0 010-14.14"/>
            </svg>
            Serviços
        </a>
    </nav>
    <div class="sidebar-user">
        <div class="user-avatar">TI</div>
        <div class="user-info">
            <div class="name">Técnico TI</div>
            <div class="email">ti@kanatech.com</div>
        </div>
    </div>
</aside>

<main class="main">
    <h1>Chamados abertos</h1>

    <table>
        <thead>
            <tr>
                <th>Atualizado em</th>
                <th>Id</th>
                <th>Título e Serviço</th>
                <th>Cliente</th>
                <th style="text-align:right; padding-right:80px;">Status</th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            <tr th:if="${#lists.isEmpty(chamados)}">
                <td colspan="6">
                    <div class="empty-state">Nenhum chamado encontrado.</div>
                </td>
            </tr>
            <tr th:each="c : ${chamados}">
                <td class="td-date" th:text="${c.dataAtualizacaoFormatada}"></td>
                <td class="td-id" th:text="${c.idFormatado}"></td>
                <td class="td-titulo">
                    <div class="titulo" th:text="${c.descricao.length() > 45 ? c.descricao.substring(0,45) + '...' : c.descricao}"></div>
                    <div class="servico" th:text="${c.servico}"></div>
                </td>
                <td>
                    <div class="td-cliente">
                        <div class="avatar" th:text="${c.iniciais}"></div>
                        <span th:text="${c.nomeSolicitante}"></span>
                    </div>
                </td>
                <td style="text-align:right; padding-right:20px;">
                    <span class="badge"
                          th:classappend="'badge-' + ${c.status.name()}"
                          th:text="${c.status.descricao}">
                    </span>
                </td>
                <td>
                    <button class="btn-edit"
                            th:data-id="${c.id}"
                            th:data-status="${c.status.name()}"
                            onclick="abrirModal(this)">
                        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/>
                            <path d="M18.5 2.5a2.12 2.12 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/>
                        </svg>
                    </button>
                </td>
            </tr>
        </tbody>
    </table>
</main>

<!-- Modal Mudar Status -->
<div class="modal-overlay" id="modalOverlay" onclick="fecharModalFora(event)">
    <div class="modal">
        <div class="modal-header">
            <h2>Mudar status da ordem</h2>
            <button class="btn-close" onclick="fecharModal()">×</button>
        </div>
        <label>Status</label>
        <select id="selectStatus">
            <option th:each="s : ${statusList}"
                    th:value="${s.name()}"
                    th:text="${s.descricao}">
            </option>
        </select>
        <button class="btn-salvar" onclick="salvarStatus()">Salvar</button>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
    let chamadoIdAtivo = null;

    function abrirModal(btn) {
        chamadoIdAtivo = btn.getAttribute('data-id');
        const statusAtual = btn.getAttribute('data-status');
        document.getElementById('selectStatus').value = statusAtual;
        document.getElementById('modalOverlay').classList.add('open');
    }

    function fecharModal() {
        document.getElementById('modalOverlay').classList.remove('open');
        chamadoIdAtivo = null;
    }

    function fecharModalFora(event) {
        if (event.target === document.getElementById('modalOverlay')) {
            fecharModal();
        }
    }

    async function salvarStatus() {
        if (!chamadoIdAtivo) return;
        const novoStatus = document.getElementById('selectStatus').value;

        try {
            const resp = await fetch(`/ti/chamado/${chamadoIdAtivo}/status`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status: novoStatus })
            });

            if (resp.ok) {
                mostrarToast('Status atualizado com sucesso!');
                fecharModal();
                setTimeout(() => location.reload(), 800);
            } else {
                mostrarToast('Erro ao atualizar status.');
            }
        } catch (e) {
            mostrarToast('Erro de conexão.');
        }
    }

    function mostrarToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2500);
    }
</script>
</body>
</html>
