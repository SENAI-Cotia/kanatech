<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login - Kanatech</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #f4f4f4;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 10px;
            width: 320px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        h2 {
            margin-bottom: 24px;
            color: #333;
            text-align: center;
        }

        input {
            width: 100%;
            margin-bottom: 15px;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 6px;
            background: #6c63ff;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #574fd6;
        }

        .erro {
            background: #ffe0e0;
            color: #c0392b;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 13px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Kanatech</h2>

    <div class="erro" th:if="${param.error}">
        Usuário ou senha incorretos.
    </div>

    <form method="post" th:action="@{/login}">

        <input type="text"
               name="username"
               placeholder="Usuário"
               required
               autofocus />

        <input type="password"
               name="password"
               placeholder="Senha"
               required />

        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}" />

        <button type="submit">Entrar</button>

    </form>
</div>

</body>
</html>
